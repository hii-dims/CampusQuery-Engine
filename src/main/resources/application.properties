spring.application.name=knowledge-assistant

# =========================================================
# Database
# =========================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/university_knowledge
spring.datasource.username=rag_user
spring.datasource.password=rag_password
spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JPA / Hibernate
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# RAG Configuration
# =========================================================

rag.chunk-size=1000
rag.chunk-overlap=200


# =========================================================
# OpenAI Configuration
# =========================================================

openai.api-key=${OPENAI_API_KEY}


# =========================================================
# Swagger / OpenAPI
# =========================================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha


