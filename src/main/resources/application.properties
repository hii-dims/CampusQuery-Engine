spring.application.name=knowledge-assistant

spring.datasource.url=jdbc:postgresql://localhost:5432/university_knowledge
spring.datasource.username=rag_user
spring.datasource.password=rag_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# RAG text chunking
rag.chunk-size=1000
rag.chunk-overlap=200

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=TRACE
