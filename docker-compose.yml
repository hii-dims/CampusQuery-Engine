services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: university-rag-postgres

    environment:
      POSTGRES_DB: university_knowledge
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d university_knowledge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
